# cargo-deny configuration.
# Phase 0 posture: license compliance is strict; advisories/yanked are advisory
# (continue-on-error in CI) and will be tightened once the dep tree stabilizes.

[advisories]
yanked = "warn"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
