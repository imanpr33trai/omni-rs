[package]
name = "db"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "load_extension", "functions", "backup", "vtab", "preupdate_hook", "serde_json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = "1"
anyhow = "1.0"
config = { path = "../config" }
auth = { path = "../auth" }
shellexpand = "3"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
